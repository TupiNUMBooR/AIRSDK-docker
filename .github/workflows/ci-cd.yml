name: CI/CD

on:
  push:

jobs:
  docker:
    name: Build and push Docker image
    runs-on: windows-2022
    outputs:
      version: ${{ steps.sdk.outputs.version }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Read SDK version
        id: sdk
        run: |
          $settings = @{}
          Get-Content .env | ForEach-Object {
            $name, $value = $_ -split '=', 2
            $settings[$name] = $value
          }
          "version=$($settings['SDK_VERSION'])" >> $env:GITHUB_OUTPUT
          "archive=$($settings['SDK_ARCHIVE'])" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Prepare image
        id: image
        run: |
          "name=ghcr.io/$($env:GITHUB_REPOSITORY.ToLower())" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Ensure Docker daemon
        run: |
          $dockerService = Get-Service -Name docker -ErrorAction SilentlyContinue
          if (-not $dockerService) {
            throw 'Docker service is not installed on the runner'
          }
          if ($dockerService.Status -ne 'Running') {
            Start-Service -Name docker
          }
        shell: pwsh

      - name: Log in to Docker registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}-windowsservercore-ltsc2022,value=${{ steps.sdk.outputs.version }}
            type=semver,pattern={{major}}.{{minor}}-windowsservercore-ltsc2022,value=${{ steps.sdk.outputs.version }}
            type=semver,pattern={{major}}-windowsservercore-ltsc2022,value=${{ steps.sdk.outputs.version }}

      - name: Build image
        run: |
          $ErrorActionPreference = 'Stop'
          $image = '${{ steps.image.outputs.name }}'
          $version = '${{ steps.sdk.outputs.version }}'
          $tag = "$version-windowsservercore-ltsc2022"
          docker build --platform windows/amd64 --build-arg SDK_VERSION=$version --build-arg SDK_ARCHIVE=${{ steps.sdk.outputs.archive }} --label org.opencontainers.image.version=$version --label org.opencontainers.image.base.name=mcr.microsoft.com/windows/servercore:ltsc2022 --tag "$image`:$tag" .
          if ($LASTEXITCODE -ne 0) { throw 'Docker build failed' }

      - name: Test image
        run: |
          $ErrorActionPreference = 'Stop'
          $image = '${{ steps.image.outputs.name }}'
          $version = '${{ steps.sdk.outputs.version }}'
          $tag = "$version-windowsservercore-ltsc2022"
          Write-Host "Running: docker run --rm --platform windows/amd64 $image`:$tag adt.bat -version"
          docker run --rm --platform windows/amd64 "$image`:$tag" adt.bat -version
          if ($LASTEXITCODE -ne 0) { throw 'ADT version test failed' }
          Write-Host "Running: docker run --rm --platform windows/amd64 $image`:$tag compc.bat -help"
          $compcHelpLines = @(& docker run --rm --platform windows/amd64 "$image`:$tag" compc.bat -help 2>&1 | ForEach-Object {
            Write-Host $_
            $_
          })
          $compcHelpExitCode = $LASTEXITCODE
          $compcHelp = $compcHelpLines -join "`n"
          Write-Host "compc help exit code: $compcHelpExitCode"
          if ($compcHelpExitCode -notin @(0, 1)) { throw "COMPc help command failed with exit code $compcHelpExitCode" }
          if ($compcHelp -notmatch 'Adobe SWC Component Compiler|compc') { throw 'COMPc help output test failed' }
          $global:LASTEXITCODE = 0

      - name: Tag and push image
        run: |
          $ErrorActionPreference = 'Stop'
          $image = '${{ steps.image.outputs.name }}'
          $version = '${{ steps.sdk.outputs.version }}'
          $tag = "$version-windowsservercore-ltsc2022"
          '${{ steps.meta.outputs.tags }}' -split "`n" | Where-Object { $_.Trim() } | ForEach-Object {
            docker tag "$image`:$tag" $_.Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Docker tag failed' }
            docker push $_.Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Docker push failed' }
          }
        shell: pwsh

  release:
    name: Create GitHub release
    needs: docker
    if: ${{ needs.docker.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create or update GitHub release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.docker.outputs.version }}
          commit: ${{ github.sha }}
          name: AIR SDK ${{ needs.docker.outputs.version }}
          generateReleaseNotes: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
