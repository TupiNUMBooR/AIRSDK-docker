name: CI/CD

on:
  push:

jobs:
  docker:
    name: Build and push Docker image
    runs-on: windows-2022

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read SDK version
        id: sdk
        run: |
          $settings = @{}
          Get-Content .env | ForEach-Object {
            $name, $value = $_ -split '=', 2
            $settings[$name] = $value
          }
          "version=$($settings['SDK_VERSION'])" >> $env:GITHUB_OUTPUT
          "archive=$($settings['SDK_ARCHIVE'])" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Prepare image
        id: image
        run: "name=ghcr.io/$($env:GITHUB_REPOSITORY.ToLower())" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.sdk.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.sdk.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.sdk.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SDK_VERSION=${{ steps.sdk.outputs.version }}
            SDK_ARCHIVE=${{ steps.sdk.outputs.archive }}
