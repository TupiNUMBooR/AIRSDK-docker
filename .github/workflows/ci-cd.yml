name: CI/CD

on:
  push:

jobs:
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.sdk.outputs.version }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Read SDK version
        id: sdk
        run: |
          . ./.env
          echo "version=$SDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=$SDK_ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "major=${SDK_VERSION%%.*}" >> "$GITHUB_OUTPUT"
          version_tail=${SDK_VERSION#*.}
          echo "minor=${SDK_VERSION%%.*}.${version_tail%%.*}" >> "$GITHUB_OUTPUT"

      - name: Prepare image
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.sdk.outputs.version }}
            type=raw,value=${{ steps.sdk.outputs.minor }}
            type=raw,value=${{ steps.sdk.outputs.major }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SDK_VERSION=${{ steps.sdk.outputs.version }}
            SDK_ARCHIVE=${{ steps.sdk.outputs.archive }}

  release:
    name: Create GitHub release
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create or update GitHub release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.docker.outputs.version }}
          commit: ${{ github.sha }}
          name: AIR SDK ${{ needs.docker.outputs.version }}
          generateReleaseNotes: true
          allowUpdates: true
