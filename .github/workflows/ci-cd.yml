name: CI/CD

on:
  push:

jobs:
  docker:
    name: Build and push Docker image
    runs-on: windows-2022

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Read SDK version
        id: sdk
        run: |
          $settings = @{}
          Get-Content .env | ForEach-Object {
            $name, $value = $_ -split '=', 2
            $settings[$name] = $value
          }
          "version=$($settings['SDK_VERSION'])" >> $env:GITHUB_OUTPUT
          "archive=$($settings['SDK_ARCHIVE'])" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Prepare image
        id: image
        run: |
          "name=ghcr.io/$($env:GITHUB_REPOSITORY.ToLower())" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Ensure Docker daemon
        run: |
          $dockerService = Get-Service -Name docker -ErrorAction SilentlyContinue
          if (-not $dockerService) {
            throw 'Docker service is not installed on the runner'
          }
          if ($dockerService.Status -ne 'Running') {
            Start-Service -Name docker
          }
        shell: pwsh

      - name: Log in to Docker registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.sdk.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.sdk.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.sdk.outputs.version }}

      - name: Build image
        run: |
          $ErrorActionPreference = 'Stop'
          $image = '${{ steps.image.outputs.name }}'
          $version = '${{ steps.sdk.outputs.version }}'
          docker build --platform windows/amd64 --build-arg SDK_VERSION=$version --build-arg SDK_ARCHIVE=${{ steps.sdk.outputs.archive }} --label org.opencontainers.image.version=$version --tag "$image`:$version" .
          if ($LASTEXITCODE -ne 0) { throw 'Docker build failed' }

      - name: Test image
        run: |
          $ErrorActionPreference = 'Stop'
          $image = '${{ steps.image.outputs.name }}'
          $version = '${{ steps.sdk.outputs.version }}'
          docker run --rm --platform windows/amd64 "$image`:$version" adt.bat -version
          if ($LASTEXITCODE -ne 0) { throw 'ADT version test failed' }
          $compcHelp = (& docker run --rm --platform windows/amd64 "$image`:$version" compc.bat -help 2>&1 | Out-String)
          $compcHelpExitCode = $LASTEXITCODE
          Write-Host "compc help exit code: $compcHelpExitCode"
          if ($compcHelp -notmatch 'Adobe SWC Component Compiler|compc') { throw 'COMPc help output test failed' }
          $global:LASTEXITCODE = 0

      - name: Tag and push image
        run: |
          $ErrorActionPreference = 'Stop'
          $image = '${{ steps.image.outputs.name }}'
          $version = '${{ steps.sdk.outputs.version }}'
          '${{ steps.meta.outputs.tags }}' -split "`n" | Where-Object { $_.Trim() } | ForEach-Object {
            docker tag "$image`:$version" $_.Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Docker tag failed' }
            docker push $_.Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Docker push failed' }
          }
        shell: pwsh
